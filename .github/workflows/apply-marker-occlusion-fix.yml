name: Apply marker occlusion fix

on:
  push:
    branches:
      - fix/marker-occlusion
    paths:
      - .github/workflows/apply-marker-occlusion-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/marker-occlusion

      - name: Patch v0.4.1
        shell: python
        run: |
          from pathlib import Path

          p = Path('content.js')
          s = p.read_text()
          old = '''  function markerIsActuallyVisible(anchor, rect) {\n    if (!Number.isFinite(rect.left) || !Number.isFinite(rect.top)) return false;\n    const clip = clippingRectFor(anchor.target || targetFromRange(anchor.pointRange));\n    const pad = 2;\n    return rect.left >= clip.left - pad && rect.left <= clip.right + pad &&\n      rect.top >= clip.top - pad && rect.top <= clip.bottom + pad;\n  }\n'''
          new = '''  function anchorPointIsUnobscured(anchor, rect) {\n    const target = anchor.target || targetFromRange(anchor.pointRange);\n    if (!isUsableTarget(target)) return false;\n\n    // A top-level fixed marker can otherwise appear to \"detach\" when a sticky,\n    // code/snippet, or other overlapping page surface passes over the real anchor.\n    // Only show the marker while the page content at the anchor point is actually\n    // the anchor target (or one of its descendants/ancestors).\n    const x = Math.max(0, Math.min(window.innerWidth - 1, rect.left));\n    const y = Math.max(0, Math.min(window.innerHeight - 1, rect.top));\n    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;\n\n    let hits = [];\n    try { hits = document.elementsFromPoint(x, y) || []; } catch (_) {}\n    for (const hit of hits) {\n      if (!hit || hit === host || String(hit.id || '').startsWith('instant-anchor-private-marker-')) continue;\n      if (hit === target || target.contains(hit) || hit.contains(target)) return true;\n      // The first real page element is what visually occupies the point. If it is\n      // unrelated to the anchor, the anchor is occluded and its pin must be hidden.\n      return false;\n    }\n    return false;\n  }\n\n  function markerIsActuallyVisible(anchor, rect) {\n    if (!Number.isFinite(rect.left) || !Number.isFinite(rect.top)) return false;\n    const clip = clippingRectFor(anchor.target || targetFromRange(anchor.pointRange));\n    const pad = 2;\n    const insideClip = rect.left >= clip.left - pad && rect.left <= clip.right + pad &&\n      rect.top >= clip.top - pad && rect.top <= clip.bottom + pad;\n    return insideClip && anchorPointIsUnobscured(anchor, rect);\n  }\n'''
          if old not in s:
              raise SystemExit('Expected marker visibility block not found')
          p.write_text(s.replace(old, new))

          manifest = Path('manifest.json')
          ms = manifest.read_text()
          manifest.write_text(ms.replace('"version": "0.4.0"', '"version": "0.4.1"'))

          changelog = Path('CHANGELOG.md')
          cs = changelog.read_text()
          entry = '''## [0.4.1] - 2026-09-09\n\n### Fixed\n- Anchor markers no longer float or appear detached when code blocks, snippet boxes, sticky surfaces, or other overlapping page elements pass over the original anchor point\n- Marker visibility now respects visual occlusion while preserving the saved jump target\n\n'''
          marker = '## [0.4.0] - 2026-09-08\n'
          if entry not in cs:
              cs = cs.replace(marker, entry + marker)
          changelog.write_text(cs)

          readme = Path('README.md')
          rs = readme.read_text()
          rs = rs.replace('**v0.4.0** — persistent multi-page notebook, page tabs, SPA navigation handling, Markdown export, and JSON backup/import.', '**v0.4.1** — marker occlusion fix for code/snippet boxes and overlapping page surfaces, with the v0.4 multi-page notebook features unchanged.')
          readme.write_text(rs)

          Path('.github/workflows/apply-marker-occlusion-fix.yml').unlink()

      - name: Validate
        run: |
          node --check background.js
          node --check content.js
          ./audit.sh

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep markers attached through overlapping content"
          git push origin HEAD:fix/marker-occlusion
